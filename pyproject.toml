[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rabtech-diagnostic"
version = "1.0.0"
description = "Diagnostic environment analysis CLI for RabTech Python Software Engineering Internship"
requires-python = ">=3.8"

[project.scripts]
rabtech-diagnostic = "rabtech_diagnostic.cli:main"

[tool.setuptools.packages.find]
include = ["rabtech_diagnostic*"]